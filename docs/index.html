<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2K Clay-Glass Weather App ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Y2K Floating Star Accents -->
    <div class="star s1">✦</div>
    <div class="star s2">★</div>

    <div class="clay-card">
        <span class="y2k-tag">★ CYBER WEATHER OS ✨</span>
        <h1>Y2K Weather</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter cyber city...">
            <button id="searchBtn">GO ⚡</button>
        </div>

        <div id="weatherInfo" class="info-container">
            <h2 id="cityName">Tokyo 🌸</h2>
            <div id="temp" class="temp-val">29°C</div>
            <p id="condition">Cyber Sparkle Glow</p>
            <div class="details-row">
                <div>HUMIDITY <br><span id="humidity">58%</span></div>
                <div>WIND <br><span id="wind">5.1 m/s</span></div>
            </div>
        </div>
        <p id="errorMsg" class="error"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
